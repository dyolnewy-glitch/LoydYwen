<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Portal - Loyd Ywen Masangcay</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">

</head>


<body class="admin-page">


    <!-- =========================
         ADMIN PORTAL
    ========================= -->

    <main class="admin-container">


        <!-- =========================
             LEFT / VISUAL PANEL
        ========================= -->

        <section class="admin-visual-panel">

            <div class="visual-stars"></div>

            <div class="visual-content">


                <!-- =========================
                     LOGO
                ========================= -->

                <div class="visual-logo">

                    <img
                        src="logo.png"
                        alt="Loyd Ywen Logo">

                </div>


                <!-- =========================
                     SMALL TITLE
                ========================= -->

                <p class="visual-small-title">
                    ADMIN PORTAL
                </p>


                <!-- =========================
                     TITLE
                ========================= -->

                <h1>
                    Welcome Back
                </h1>


                <!-- =========================
                     DESCRIPTION
                ========================= -->

                <p class="visual-description">

                    Manage your portfolio, gallery,
                    blog, and website content from one place.

                </p>


                <!-- =========================
                     LINE
                ========================= -->

                <div class="visual-line"></div>


                <!-- =========================
                     FOOTER
                ========================= -->

                <p class="visual-footer">
                    Loyd Ywen Masangcay
                </p>


            </div>

        </section>


        <!-- =========================
             RIGHT / LOGIN PANEL
        ========================= -->

        <section class="admin-login-panel">


            <div class="login-content">


                <!-- =========================
                     LOGIN HEADING
                ========================= -->

                <div class="login-heading">


                    <span class="login-badge">
                        🔐 Secure Access
                    </span>


                    <h2>
                        Admin Login
                    </h2>


                    <p>
                        Sign in to continue to your dashboard.
                    </p>


                </div>


                <!-- =========================
                     LOGIN FORM
                ========================= -->

                <form id="loginForm">


                    <!-- =========================
                         EMAIL
                    ========================= -->

                    <div class="form-group">


                        <label for="adminEmail">
                            Email
                        </label>


                        <div class="input-wrapper">


                            <span class="input-icon">
                                ✉️
                            </span>


                            <input
                                type="email"
                                id="adminEmail"
                                name="email"
                                placeholder="Enter your email"
                                autocomplete="username"
                                required>


                        </div>


                    </div>


                    <!-- =========================
                         PASSWORD
                    ========================= -->

                    <div class="form-group">


                        <label for="adminPassword">
                            Password
                        </label>


                        <div class="input-wrapper">


                            <span class="input-icon">
                                🔒
                            </span>


                            <input
                                type="password"
                                id="adminPassword"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required>


                            <button
                                type="button"
                                class="password-toggle"
                                id="passwordToggle"
                                aria-label="Show password">

                                👁

                            </button>


                        </div>


                    </div>


                    <!-- =========================
                         LOGIN BUTTON
                    ========================= -->

                    <button
                        type="submit"
                        class="admin-submit"
                        id="loginButton">


                        <span id="loginButtonText">
                            Login to Dashboard
                        </span>


                    </button>


                </form>


                <!-- =========================
                     LOGIN MESSAGE
                ========================= -->

                <p
                    id="loginMessage"
                    class="login-message">
                </p>


                <!-- =========================
                     BACK HOME
                ========================= -->

                <a
                    href="index.html"
                    class="back-home">

                    ← Back to Home

                </a>


            </div>


        </section>


    </main>


    <!-- =========================
         SUPABASE
    ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =========================
         ADMIN JAVASCRIPT
    ========================= -->

    <script src="admin.js"></script>


</body>

</html>
