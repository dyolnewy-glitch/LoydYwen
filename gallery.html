    <meta name="description" content="Explore my creative works, graphic designs, posters, UI/UX projects, photo edits, and digital artwork.">

    <title>Gallery | Loyd Ywen</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="gallery.css">
</head>

<body>

    <!-- =========================

    ========================== -->

    <header>

            <a href="index.html" class="logo">

            </a>

            <button
                class="menu-toggle"
                type="button"
                aria-label="Toggle navigation"
                aria-expanded="false"
                onclick="toggleMenu(this)">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="skills.html">Skills</a></li>
                    <li><a href="portfolio.html">Porfolio</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="gallery.html" class="active">Gallery</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>

        </div>
    </header>


    <!-- =========================
         GALLERY SECTION
    ========================== -->

    <main>

        <section class="gallery-section">

            <div class="gallery-container">

                <!-- GALLERY HEADER -->

                <div class="gallery-sidebar">

                    <h1>My Gallery</h1>

                    <p>
                        A collection of my creative works, designs,
                        edits, and digital projects.
                    </p>

                </div>


                <!-- CATEGORY DROPDOWN -->

                <div class="category-dropdown">

                    <button
                        type="button"
                        class="category-dropdown-btn"
                        id="categoryDropdownBtn"
                        aria-expanded="false">

                        <span>
                            Category:
                            <span id="selectedCategory">All</span>
                        </span>

                        <span class="dropdown-arrow" aria-hidden="true">
                            &#9662;
                        </span>

                    </button>


                    <div
                        class="category-dropdown-menu"
                        id="categoryDropdownMenu">

                        <button
                            type="button"
                            class="category-option active"
                            data-category="all">
                            All
                        </button>

                        <button
                            type="button"
                            class="category-option"
                            data-category="poster">
                            Poster
                        </button>

                        <button
                            type="button"
                            class="category-option"
                            data-category="uiux">
                            UI/UX Design
                        </button>

                        <button
                            type="button"
                            class="category-option"
                            data-category="graphic">
                            Graphic Design
                        </button>

                        <button
                            type="button"
                            class="category-option"
                            data-category="photo">
                            Photo Editing
                        </button>

                        <button
                            type="button"
                            class="category-option"
                            data-category="video">
                            Video Editing
                        </button>

                        <button
                            type="button"
                            class="category-option"
                            data-category="digital-art">
                            Digital Art
                        </button>

                        <button
                            type="button"
                            class="category-option"
                            data-category="drawing">
                            Drawing
                        </button>

                        <button
                            type="button"
                            class="category-option"
                            data-category="other">
                            Other
                        </button>

                    </div>

                </div>


                <!-- GALLERY IMAGES -->

                <div class="gallery-content">

                    <div
                        class="gallery-grid"
                        id="galleryGrid">
                    </div>


                    <!-- EMPTY / ERROR MESSAGE -->

                    <div
                        id="galleryEmpty"
                        class="gallery-empty"
                        style="display:none;">

                        <p>No images available in this category.</p>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         IMAGE PREVIEW
    ========================== -->

    <div
        class="gallery-overlay"
        id="galleryOverlay"
        role="dialog"
        aria-modal="true"
        aria-label="Gallery image preview">

        <img
            id="galleryPreview"
            class="gallery-preview"
            src=""
            alt="Gallery image preview">

    </div>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <div class="container">

            <p>
                &copy; <span id="currentYear"></span>
                Loyd Ywen. All rights reserved.
            </p>

            <div class="social-links">

                <a
                    href="https://www.facebook.com/"
                    target="_blank"
                    rel="noopener noreferrer">
                    Facebook
                </a>

                <a
                    href="https://www.instagram.com/"
                    target="_blank"
                    rel="noopener noreferrer">
                    Instagram
                </a>

                <a
                    href="https://github.com/dyolnewy-glitch"
                    target="_blank"
                    rel="noopener noreferrer">
                    GitHub
                </a>

            </div>

        </div>

    </footer>


    <!-- =========================
         SUPABASE LIBRARY
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>
        /* =========================================
           SUPABASE CONFIGURATION
        ========================================= */

        const SUPABASE_URL =
            "https://pgkrgwplunepdvrmixvj.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_Nq1UrsN6b0YXQcKfWvKfwQ_OhJiS6yy";

        const GALLERY_TABLE = "gallery_items";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        /* =========================================
           ELEMENTS AND STATE
        ========================================= */

        const galleryGrid =
            document.getElementById("galleryGrid");

        const galleryEmpty =
            document.getElementById("galleryEmpty");

        const dropdownButton =
            document.getElementById("categoryDropdownBtn");

        const dropdownMenu =
            document.getElementById("categoryDropdownMenu");

        const selectedCategory =
            document.getElementById("selectedCategory");

        const categoryOptions =
            document.querySelectorAll(".category-option");

        const galleryOverlay =
            document.getElementById("galleryOverlay");

        const galleryPreview =
            document.getElementById("galleryPreview");

        let galleryData = [];
        let currentCategory = "all";
        let galleryChannel = null;
        let isLoadingGallery = false;
        let reloadRequested = false;


        document.getElementById("currentYear").textContent =
            new Date().getFullYear();


        /* =========================================
           LOAD GALLERY FROM SUPABASE
        ========================================= */

        async function loadGalleryData() {

            if (isLoadingGallery) {
                reloadRequested = true;
                return;
            }

            isLoadingGallery = true;

            try {

                const { data, error } = await supabaseClient
                    .from(GALLERY_TABLE)
                    .select("id, title, category, image, created_at")
                    .order("created_at", { ascending: false });

                if (error) {
                    throw error;
                }

                galleryData = (data || []).map(function(item) {

                    return {
                        id: item.id,
                        title: item.title || "",
                        category: item.category || "Other",
                        image: item.image || "",
                        created_at: item.created_at || ""
                    };

                });

                renderGallery();

                console.log(
                    "Gallery loaded from Supabase:",
                    galleryData.length,
                    "items"
                );

            } catch (error) {

                console.error(
                    "Unable to load public gallery:",
                    error
                );

                galleryEmpty.style.display = "block";

                const message =
                    galleryEmpty.querySelector("p");

                if (message) {
                    message.textContent =
                        "Unable to load gallery. Please try again later.";
                }

            } finally {

                isLoadingGallery = false;

                if (reloadRequested) {
                    reloadRequested = false;
                    loadGalleryData();
                }

            }

        }


        /* =========================================
           CATEGORY NORMALIZATION
        ========================================= */

        function normalizeCategory(category) {

            const value = String(category || "other")
                .trim()
                .toLowerCase();

            const categoryMap = {
                "all": "all",
                "poster": "poster",

                "ui/ux design": "uiux",
                "ui/ux": "uiux",
                "uiux": "uiux",
                "ui-ux": "uiux",

                "graphic design": "graphic",
                "graphic": "graphic",

                "photo editing": "photo",
                "photo": "photo",

                "video editing": "video",
                "video": "video",

                "digital art": "digital-art",
                "digital-art": "digital-art",

                "drawing": "drawing",
                "other": "other"
            };

            return categoryMap[value] || value;

        }


        /* =========================================
           RENDER MASONRY GALLERY
           Uses the existing gallery.css layout.
        ========================================= */

        function renderGallery() {

            galleryGrid.innerHTML = "";

            const filteredItems = galleryData.filter(function(item) {

                if (currentCategory === "all") {
                    return true;
                }

                return normalizeCategory(item.category) === currentCategory;

            });

            let visibleCount = 0;

            filteredItems.forEach(function(item) {

                if (!item.image) {
                    return;
                }

                const galleryItem =
                    document.createElement("div");

                galleryItem.className = "gallery-item";

                galleryItem.dataset.category =
                    normalizeCategory(item.category);


                const image = document.createElement("img");

                image.src = item.image;

                image.alt = item.title || "Gallery image";

                image.loading = "lazy";

                image.decoding = "async";


                image.addEventListener("error", function() {

                    console.error(
                        "Gallery image failed to load:",
                        item.image
                    );

                    galleryItem.remove();

                    if (galleryGrid.children.length === 0) {

                        galleryEmpty.style.display = "block";

                        const message =
                            galleryEmpty.querySelector("p");

                        if (message) {
                            message.textContent =
                                "Some images could not be loaded.";
                        }

                    }

                }, { once: true });


                galleryItem.appendChild(image);

                galleryGrid.appendChild(galleryItem);

                visibleCount++;

            });


            galleryEmpty.style.display =
                visibleCount === 0 ? "block" : "none";

            if (visibleCount === 0) {

                const message =
                    galleryEmpty.querySelector("p");

                if (message) {
                    message.textContent =
                        "No images available in this category.";
                }

            }

        }


        /* =========================================
           REALTIME GALLERY UPDATES
        ========================================= */

        function subscribeToGalleryChanges() {

            if (galleryChannel) {
                return;
            }

            galleryChannel = supabaseClient
                .channel("public-gallery-live-updates")

                .on(
                    "postgres_changes",
                    {
                        event: "*",
                        schema: "public",
                        table: GALLERY_TABLE
                    },
                    function(payload) {

                        console.log(
                            "Gallery updated:",
                            payload.eventType
                        );

                        loadGalleryData();

                    }
                )

                .subscribe(function(status) {

                    console.log(
                        "Gallery Realtime status:",
                        status
                    );

                    if (status === "SUBSCRIBED") {
                        loadGalleryData();
                    }

                });

        }


        /* =========================================
           CATEGORY DROPDOWN
        ========================================= */

        dropdownButton.addEventListener("click", function(event) {

            event.stopPropagation();

            const isOpen =
                dropdownMenu.classList.toggle("show");

            dropdownButton.classList.toggle("open", isOpen);

            dropdownButton.setAttribute(
                "aria-expanded",
                String(isOpen)
            );

        });


        categoryOptions.forEach(function(option) {

            option.addEventListener("click", function(event) {

                event.stopPropagation();

                currentCategory =
                    this.dataset.category || "all";

                categoryOptions.forEach(function(item) {
                    item.classList.remove("active");
                });

                this.classList.add("active");

                selectedCategory.textContent =
                    this.textContent.trim();

                dropdownMenu.classList.remove("show");

                dropdownButton.classList.remove("open");

                dropdownButton.setAttribute(
                    "aria-expanded",
                    "false"
                );

                renderGallery();

            });

        });


        document.addEventListener("click", function(event) {

            if (
                !dropdownButton.contains(event.target) &&
                !dropdownMenu.contains(event.target)
            ) {

                dropdownMenu.classList.remove("show");

                dropdownButton.classList.remove("open");

                dropdownButton.setAttribute(
                    "aria-expanded",
                    "false"
                );

            }

        });


        /* =========================================
           IMAGE PREVIEW
        ========================================= */

        galleryGrid.addEventListener("click", function(event) {

            const image =
                event.target.closest(".gallery-item img");

            if (!image) {
                return;
            }

            galleryPreview.src = image.src;

            galleryPreview.alt = image.alt;

            galleryOverlay.classList.add("show");

        });


        function closeGalleryPreview() {

            galleryOverlay.classList.remove("show");

            galleryPreview.src = "";

        }


        galleryOverlay.addEventListener("click", function(event) {

            if (event.target === galleryOverlay) {
                closeGalleryPreview();
            }

        });


        document.addEventListener("keydown", function(event) {

            if (event.key === "Escape") {
                closeGalleryPreview();
            }

        });


        /* =========================================
           MOBILE MENU
        ========================================= */

        function toggleMenu(button) {

            const nav = document.querySelector("header nav");

            if (!nav) {
                return;
            }

            const isOpen = nav.classList.toggle("show");

            if (button) {

                button.classList.toggle("active", isOpen);

                button.setAttribute(
                    "aria-expanded",
                    String(isOpen)
                );

            }

        }


        document.querySelectorAll("header nav a").forEach(function(link) {

            link.addEventListener("click", function() {

                const nav =
                    document.querySelector("header nav");

                const menuButton =
                    document.querySelector(".menu-toggle");

                if (nav) {
                    nav.classList.remove("show");
                }

                if (menuButton) {

                    menuButton.classList.remove("active");

                    menuButton.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                }

            });

        });


        /* =========================================
           REFRESH ON RETURN TO PAGE
        ========================================= */

        document.addEventListener("visibilitychange", function() {

            if (document.visibilityState === "visible") {
                loadGalleryData();
            }

        });


        window.addEventListener("pageshow", function() {
            loadGalleryData();
        });


        /* =========================================
           INITIALIZE
        ========================================= */

        loadGalleryData();

        subscribeToGalleryChanges();

    </script>


    <!-- EXISTING DARK MODE SCRIPT -->

    <script src="darkmode.js"></script>

</body>
