<!-- =========================
     GALLERY JAVASCRIPT
========================= -->

<script>


/* =========================================================
   GALLERY STORAGE
========================================================= */

const GALLERY_STORAGE_KEY = "galleryItems";


let galleryData = [];

let currentCategory = "all";


/* =========================================================
   ELEMENTS
========================================================= */

const galleryGrid =
document.getElementById("galleryGrid");


const galleryEmpty =
document.getElementById("galleryEmpty");


const dropdownButton =
document.getElementById("categoryDropdownBtn");


const dropdownMenu =
document.getElementById("categoryDropdownMenu");


const selectedCategory =
document.getElementById("selectedCategory");


const options =
document.querySelectorAll(".category-option");


const galleryOverlay =
document.getElementById("galleryOverlay");


const galleryPreview =
document.getElementById("galleryPreview");


/* =========================================================
   LOAD GALLERY DATA
========================================================= */

function loadGalleryData() {

try {

galleryData =
JSON.parse(
localStorage.getItem(
GALLERY_STORAGE_KEY
)
) || [];

}

catch(error) {

console.error(
"Unable to load gallery data:",
error
);

galleryData = [];

}

renderGallery();

}


/* =========================================================
   RENDER PUBLIC GALLERY
========================================================= */

function renderGallery() {

if (!galleryGrid) {

return;

}


galleryGrid.innerHTML = "";


let filteredItems = galleryData.filter(
function(item) {

if (currentCategory === "all") {

return true;

}

return normalizeCategory(
item.category
) === currentCategory;

});


/* =========================
   EMPTY GALLERY
========================= */

if (filteredItems.length === 0) {

if (galleryEmpty) {

galleryEmpty.style.display = "block";

}

return;

}


if (galleryEmpty) {

galleryEmpty.style.display = "none";

}


/* =========================
   CREATE IMAGE CARDS
========================= */

filteredItems.forEach(
function(item) {

const imageSource =
item.image ||
item.fileName ||
"";


if (!imageSource) {

return;

}


const galleryItem =
document.createElement("div");

galleryItem.className =
"gallery-item";


galleryItem.setAttribute(
"data-category",
normalizeCategory(
item.category
)
);


const image =
document.createElement("img");


image.src =
imageSource;


image.alt =
"Gallery Image";


image.loading =
"lazy";


galleryItem.appendChild(
image
);


galleryGrid.appendChild(
galleryItem
);

});

}


/* =========================================================
   NORMALIZE CATEGORY
========================================================= */

function normalizeCategory(category) {

if (!category) {

return "other";

}


const value =
String(category)
.trim()
.toLowerCase();


const categoryMap = {

"all":
"all",

"poster":
"poster",

"ui/ux design":
"uiux",

"ui/ux":
"uiux",

"uiux":
"uiux",

"graphic design":
"graphic",

"graphic":
"graphic",

"photo editing":
"photo",

"photo":
"photo",

"video editing":
"video",

"video":
"video",

"digital art":
"digital-art",

"digital-art":
"digital-art",

"drawing":
"drawing",

"other":
"other"

};


return categoryMap[value] || value;

}


/* =========================================================
   MOBILE MENU
========================================================= */

function toggleMenu(menu) {

const nav =
document.querySelector("header nav");


if (nav) {

nav.classList.toggle("show");

}


if (menu) {

menu.classList.toggle("active");

}

}


document
.querySelectorAll("nav ul li a")
.forEach(function(link) {

link.addEventListener(
"click",
function() {

const nav =
document.querySelector(
"header nav"
);


const menu =
document.querySelector(
".menu-toggle"
);


if (nav) {

nav.classList.remove(
"show"
);

}


if (menu) {

menu.classList.remove(
"active"
);

}

});

});


/* =========================================================
   CATEGORY DROPDOWN
========================================================= */

if (
dropdownButton &&
dropdownMenu
) {

dropdownButton.addEventListener(
"click",
function(event) {

event.stopPropagation();


dropdownMenu.classList.toggle(
"show"
);


dropdownButton.classList.toggle(
"open"
);

});

}


/* =========================================================
   CATEGORY FILTER
========================================================= */

options.forEach(function(option) {

option.addEventListener(
"click",
function(event) {

event.stopPropagation();


currentCategory =
this.getAttribute(
"data-category"
) || "all";


options.forEach(
function(item) {

item.classList.remove(
"active"
);

});


this.classList.add(
"active"
);


if (selectedCategory) {

selectedCategory.textContent =
this.textContent.trim();

}


if (dropdownMenu) {

dropdownMenu.classList.remove(
"show"
);

}


if (dropdownButton) {

dropdownButton.classList.remove(
"open"
);

}


renderGallery();

});

});


/* =========================================================
   CLOSE DROPDOWN
========================================================= */

document.addEventListener(
"click",
function(event) {

if (
dropdownButton &&
dropdownMenu &&
!dropdownButton.contains(
event.target
) &&
!dropdownMenu.contains(
event.target
)
) {

dropdownMenu.classList.remove(
"show"
);

dropdownButton.classList.remove(
"open"
);

}

});


/* =========================================================
   IMAGE PREVIEW
========================================================= */

if (
galleryGrid &&
galleryOverlay &&
galleryPreview
) {

galleryGrid.addEventListener(
"click",
function(event) {

const image =
event.target.closest(
".gallery-item img"
);


if (!image) {

return;

}


galleryPreview.src =
image.src;


galleryPreview.alt =
image.alt;


galleryOverlay.classList.add(
"show"
);

});



/* =========================
   CLOSE PREVIEW
========================= */

galleryPreview.addEventListener(
"click",
function() {

galleryOverlay.classList.remove(
"show"
);


galleryPreview.src = "";

});


galleryOverlay.addEventListener(
"click",
function(event) {

if (
event.target ===
galleryOverlay
) {

galleryOverlay.classList.remove(
"show"
);


galleryPreview.src = "";

}

});

}


/* =========================================================
   ESCAPE KEY
========================================================= */

document.addEventListener(
"keydown",
function(event) {

if (
event.key === "Escape"
) {

if (galleryOverlay) {

galleryOverlay.classList.remove(
"show"
);

}


if (galleryPreview) {

galleryPreview.src = "";

}

}

});


/* =========================================================
   UPDATE WHEN ADMIN ADDS / EDITS / DELETES
========================================================= */

window.addEventListener(
"storage",
function(event) {

if (
event.key ===
GALLERY_STORAGE_KEY
) {

loadGalleryData();

}

});


/* =========================================================
   UPDATE WHEN RETURNING TO PAGE
========================================================= */

document.addEventListener(
"visibilitychange",
function() {

if (
document.visibilityState ===
"visible"
) {

loadGalleryData();

}

});


/* =========================================================
   INITIAL LOAD
========================================================= */

loadGalleryData();

</script>
